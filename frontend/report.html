<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giri-Rakshak | Report Landslide Incident</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #d9534f;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0275d8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button.geo-btn {
            background-color: #5cb85c;
            margin-top: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Giri-Rakshak Incident Report</h2>
    <p>Report cracks, slope movement, or active landslides immediately.</p>
    
    <form id="reportForm">
        <div class="form-group">
            <label for="reporter_name">Reporter Name / Phone</label>
            <input type="text" id="reporter_name" required placeholder="+91XXXXXXXXXX or Name">
        </div>

        <div class="form-group">
            <label for="description">Observation Details</label>
            <textarea id="description" rows="3" required placeholder="Describe soil movement, road cracks, or rockfalls..."></textarea>
        </div>

        <div class="form-group">
            <label>Location Coordinates</label>
            <button type="button" class="geo-btn" onclick="getLocation()">📍 Use My Location (Auto-GPS)</button>
            <div style="display: flex; gap: 10px; margin-top: 8px;">
                <input type="number" step="any" id="lat" placeholder="Latitude" required>
                <input type="number" step="any" id="lon" placeholder="Longitude" required>
            </div>
        </div>

        <div class="form-group">
            <label for="photo">Upload Incident Photo</label>
            <input type="file" id="photo" accept="image/*" capture="environment">
        </div>

        <button type="submit">Submit Incident Report</button>
    </form>

    <div id="status"></div>
</div>

<script>
    function getLocation() {
        const status = document.getElementById('status');
        if (navigator.geolocation) {
            status.innerText = "Acquiring GPS location...";
            status.style.color = "blue";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('lat').value = position.coords.latitude.toFixed(6);
                    document.getElementById('lon').value = position.coords.longitude.toFixed(6);
                    status.innerText = "Location updated!";
                    status.style.color = "green";
                },
                (error) => {
                    status.innerText = "Unable to retrieve location. Please enter manually.";
                    status.style.color = "red";
                }
            );
        } else {
            status.innerText = "Geolocation is not supported by your browser.";
            status.style.color = "red";
        }
    }

    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const status = document.getElementById('status');
        status.innerText = "Submitting report...";
        status.style.color = "blue";

        const payload = {
            reporter_info: document.getElementById('reporter_name').value,
            description: document.getElementById('description').value,
            lat: parseFloat(document.getElementById('lat').value),
            lon: parseFloat(document.getElementById('lon').value),
            timestamp: new Date().toISOString()
        };

        try {
            const response = await fetch('/api/citizen-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                status.innerText = "Report submitted successfully! Dashboard updated.";
                status.style.color = "green";
                document.getElementById('reportForm').reset();
            } else {
                status.innerText = "Submitted locally (Backend endpoint connecting soon).";
                status.style.color = "orange";
            }
        } catch (err) {
            status.innerText = "Report recorded locally (Awaiting live backend deployment).";
            status.style.color = "orange";
        }
    });
</script>

</body>
</html>
